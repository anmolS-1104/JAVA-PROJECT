name: CI/CD Pipeline - Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Verify Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Build Check
        run: |
          echo "Starting CI Pipeline check..."
          echo "Node version: $(node -v)"
          echo "Environment build and configuration check passed."
